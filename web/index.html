<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Studio - Phase 0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>📄 Paper Studio</h1>
            <span class="version">Phase 0 - Technical Preview</span>
        </header>

        <main class="container">
            <div class="editor-pane">
                <div class="pane-header">
                    <span class="pane-title">PaperML Editor</span>
                    <span class="status" id="status">Ready</span>
                </div>
                <textarea id="editor" spellcheck="false"></textarea>
            </div>

            <div class="preview-pane">
                <div class="pane-header">
                    <span class="pane-title">Preview</span>
                    <button id="refresh-btn" title="Refresh">🔄</button>
                </div>
                <div id="preview" class="preview-content">
                    <p class="loading">Loading demo.pml...</p>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <span id="parse-time"></span>
        </footer>
    </div>

    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
    window.addEventListener('DOMContentLoaded', function() {
        var editor = document.getElementById('editor');
        var preview = document.getElementById('preview');
        var parseTime = document.getElementById('parse-time');
        var refreshBtn = document.getElementById('refresh-btn');

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function parseInline(text) {
            text = text.replace(/@cite\{([^}]+)\}/g, '<cite class="citation">[$1]</cite>');
            text = text.replace(/@ref\{([^}]+)\}/g, '<a href="#$1" class="reference">$1</a>');
            text = text.replace(/\$([^$]+)\$/g, '\\($1\\)');
            return text;
        }

        // Parse a flat block: extracts key="value" attrs, key=[...] arrays, and plain text body
        function parseFlatBlock(lines, startIndex) {
            var braceCount = 0;
            var content = '';
            var i = startIndex;
            for (; i < lines.length; i++) {
                var line = lines[i];
                content += line + '\n';
                for (var j = 0; j < line.length; j++) {
                    if (line[j] === '{') braceCount++;
                    if (line[j] === '}') braceCount--;
                }
                if (braceCount === 0) break;
            }
            var attrs = {};
            var match;
            var re = /(\w+)\s*=\s*"([^"]*)"/g;
            while ((match = re.exec(content)) !== null) {
                attrs[match[1]] = match[2];
            }

            function extractArray(name) {
                var m = content.match(new RegExp(name + '\\s*=\\s*\\[([\\s\\S]*?)\\]'));
                if (m) return (m[1].match(/"([^"]*)"/g) || []).map(function(s) { return s.replace(/"/g, ''); });
                return null;
            }
            var cols = extractArray('columns');
            if (cols) attrs.columns = cols;
            var keywords = extractArray('keywords');
            if (keywords) attrs.keywords = keywords;

            var rowsMatch = content.match(/rows\s*=\s*\[([\s\S]*?)\]\s*\}/);
            if (rowsMatch) {
                var rowMatches = rowsMatch[1].match(/\[[^\]]+\]/g) || [];
                attrs.rows = rowMatches.map(function(row) {
                    return (row.match(/"([^"]*)"/g) || []).map(function(s) { return s.replace(/"/g, ''); });
                });
            }

            var firstBrace = content.indexOf('{');
            var lastBrace = content.lastIndexOf('}');
            var body = '';
            if (firstBrace >= 0 && lastBrace > firstBrace) {
                body = content.substring(firstBrace + 1, lastBrace)
                    .split('\n')
                    .filter(function(l) { return !/^\s*\w+\s*=\s*/.test(l); })
                    .join('\n').trim();
            }
            return { attrs: attrs, body: body, contentLines: content.split('\n').slice(1, -1), endIndex: i };
        }

        // Parse a container block that may contain nested @sub-block{...} inside
        function parseContainerBlock(lines, startIndex) {
            var braceCount = 0;
            var content = '';
            var i = startIndex;
            for (; i < lines.length; i++) {
                var line = lines[i];
                content += line + '\n';
                for (var j = 0; j < line.length; j++) {
                    if (line[j] === '{') braceCount++;
                    if (line[j] === '}') braceCount--;
                }
                if (braceCount === 0) break;
            }

            // Extract top-level attrs: walk lines, skip anything inside @... blocks
            var contentLines = content.split('\n');
            var topLines = [];
            var inSub = false;
            var subBrace = 0;
            for (var cl = 0; cl < contentLines.length; cl++) {
                var cline = contentLines[cl].trim();
                if (/^@\w+\s*\{/.test(cline) && cl > 0) { inSub = true; subBrace = 1; continue; }
                if (inSub) {
                    for (var cj = 0; cj < contentLines[cl].length; cj++) {
                        if (contentLines[cl][cj] === '{') subBrace++;
                        if (contentLines[cl][cj] === '}') subBrace--;
                    }
                    if (subBrace <= 0) { inSub = false; subBrace = 0; continue; }
                    continue; // skip lines inside sub-block
                }
                topLines.push(cline);
            }
            var topText = topLines.join('\n');

            var attrs = {};
            var match;
            var re = /(\w+)\s*=\s*"([^"]*)"/g;
            while ((match = re.exec(topText)) !== null) {
                attrs[match[1]] = match[2];
            }

            // Split inner content into lines, strip outer braces
            var inner = content.substring(content.indexOf('{') + 1, content.lastIndexOf('}'));
            var innerLines = inner.split('\n');

            // Walk inner lines and collect sub-blocks
            var subBlocks = []; // [{type: '@author', attrs: ..., body: ...}, ...]
            var plainLines = [];
            var si = 0;
            while (si < innerLines.length) {
                var sline = innerLines[si].trim();
                if (sline === '') { plainLines.push(''); si++; continue; }

                var subMatch = sline.match(/^@(\w+)\s*\{/);
                if (subMatch) {
                    var subtype = subMatch[1];
                    var subResult = parseFlatBlock(innerLines, si);
                    subBlocks.push({ type: subtype, attrs: subResult.attrs, body: subResult.body });
                    si = subResult.endIndex + 1;
                    continue;
                }
                plainLines.push(innerLines[si]);
                si++;
            }

            var plainBody = plainLines.join('\n').trim();
            return { attrs: attrs, body: plainBody, subBlocks: subBlocks, endIndex: i };
        }

        // Render functions --------------------------------------------------

        function renderAuthorTag(a, footnotes) {
            var parts = [escapeHtml(a.name)];
            var superscripts = '';
            if (a.note && footnotes) {
                for (var fni = 0; fni < footnotes.length; fni++) {
                    if (footnotes[fni].label === a.note) superscripts += '<sup>' + escapeHtml(footnotes[fni].marker) + '</sup>';
                }
            }
            if (a.corresponding && footnotes) {
                for (var fni = 0; fni < footnotes.length; fni++) {
                    if (footnotes[fni].label === 'corresponding') superscripts += '<sup>' + escapeHtml(footnotes[fni].marker) + '</sup>';
                }
            }
            parts[0] += superscripts;
            if (a.affiliation) parts.push('<span class="author-affil">' + escapeHtml(a.affiliation) + '</span>');
            var emailLink = a.email ? ' <a class="author-email" href="mailto:' + escapeHtml(a.email) + '">✉</a>' : '';
            return '<span class="author">' + parts.join('<br>') + emailLink + '</span>';
        }

        function renderHeader(attrs, authors, footnotes) {
            var title = attrs.title ? '<h1 class="paper-title">' + escapeHtml(attrs.title) + '</h1>\n' : '';
            var authorHtml = '';
            if (authors && authors.length) {
                authorHtml = '<p class="paper-authors">\n' + authors.map(function(a) {
                    return renderAuthorTag(a, footnotes);
                }).join('\n') + '\n</p>\n';
            }
            return '<header class="paper-header">\n' + title + authorHtml + '</header>\n';
        }

        function renderFigure(attrs) {
            var id = attrs.label ? ' id="' + escapeHtml(attrs.label) + '"' : '';
            var caption = attrs.caption ? '<figcaption>' + escapeHtml(attrs.caption) + '</figcaption>' : '';
            return '<figure' + id + '>\n  <img src="' + escapeHtml(attrs.path || '') + '" alt="' + escapeHtml(attrs.caption || '') + '" onerror="this.style.display=\'none\'">\n  ' + caption + '\n</figure>\n';
        }

        function renderTable(attrs) {
            var id = attrs.label ? ' id="' + escapeHtml(attrs.label) + '"' : '';
            var caption = attrs.caption ? '<figcaption>' + escapeHtml(attrs.caption) + '</figcaption>' : '';
            var html = '<figure class="table-container"' + id + '>\n' + caption + '\n<table>\n';
            if (attrs.columns && attrs.columns.length > 0) {
                html += '<thead><tr>\n';
                attrs.columns.forEach(function(c) { html += '<th>' + escapeHtml(c) + '</th>\n'; });
                html += '</tr></thead>\n';
            }
            if (attrs.rows && attrs.rows.length > 0) {
                html += '<tbody>\n';
                attrs.rows.forEach(function(row) {
                    html += '<tr>\n';
                    row.forEach(function(c) { html += '<td>' + escapeHtml(c) + '</td>\n'; });
                    html += '</tr>\n';
                });
                html += '</tbody>\n';
            }
            html += '</table>\n</figure>\n';
            return html;
        }

        function renderEquation(attrs) {
            var id = attrs.label ? ' id="' + escapeHtml(attrs.label) + '"' : '';
            return '<div class="equation"' + id + '>\n\\[' + (attrs.content || '') + '\\]\n</div>\n';
        }

        function renderAbstract(result) {
            var body = result.body || '';
            var html = '<div class="paper-abstract">\n<h3>Abstract</h3>\n<p>' + parseInline(body) + '</p>\n';
            if (result.attrs.keywords && result.attrs.keywords.length) {
                html += '<p class="paper-keywords"><strong>Keywords:</strong> ' + result.attrs.keywords.map(function(k) { return '<span class="keyword">' + escapeHtml(k) + '</span>'; }).join(', ') + '</p>\n';
            }
            html += '</div>\n';
            return html;
        }

        function renderFootnotes(footnotes) {
            if (!footnotes || !footnotes.length) return '';
            var html = '<div class="paper-footnotes"><hr>';
            footnotes.forEach(function(f) {
                html += '<p class="footnote"><sup>' + escapeHtml(f.marker) + '</sup> ' + parseInline(f.body || '') + '</p>';
            });
            html += '</div>';
            return html;
        }

        // Main parser -------------------------------------------------------

        function parse(input) {
            var lines = input.split('\n');
            var titleAttrs = {};
            var authorList = [];
            var footnoteList = [];
            var html = '';
            var i = 0;

            while (i < lines.length) {
                var line = lines[i].trim();
                if (line === '') { i++; continue; }

                if (line.startsWith('@title{')) {
                    var result = parseContainerBlock(lines, i);
                    titleAttrs = result.attrs;
                    result.subBlocks.forEach(function(sb) {
                        if (sb.type === 'author') authorList.push(sb.attrs);
                        else if (sb.type === 'footnote') footnoteList.push({ marker: sb.attrs.marker, label: sb.attrs.label, body: sb.body });
                    });
                    i = result.endIndex + 1;
                    continue;
                }

                if (line.startsWith('@section ')) {
                    html += '<h2 class="section-title">' + escapeHtml(line.substring(9).trim()) + '</h2>\n';
                    i++; continue;
                }
                if (line.startsWith('@subsection ')) {
                    html += '<h3 class="section-title">' + escapeHtml(line.substring(12).trim()) + '</h3>\n';
                    i++; continue;
                }
                if (line.startsWith('@subsubsection ')) {
                    html += '<h4 class="section-title">' + escapeHtml(line.substring(15).trim()) + '</h4>\n';
                    i++; continue;
                }
                if (line.startsWith('@figure{')) {
                    var result = parseFlatBlock(lines, i);
                    html += renderFigure(result.attrs);
                    i = result.endIndex + 1;
                    continue;
                }
                if (line.startsWith('@table{')) {
                    var result = parseFlatBlock(lines, i);
                    html += renderTable(result.attrs);
                    i = result.endIndex + 1;
                    continue;
                }
                if (line.startsWith('@equation{')) {
                    var result = parseFlatBlock(lines, i);
                    html += renderEquation(result.attrs);
                    i = result.endIndex + 1;
                    continue;
                }
                if (line.startsWith('@abstract{')) {
                    var result = parseFlatBlock(lines, i);
                    html += renderAbstract(result);
                    i = result.endIndex + 1;
                    continue;
                }
                if (!line.startsWith('@')) {
                    html += '<p>' + parseInline(line) + '</p>\n';
                    i++;
                    continue;
                }
                i++;
            }

            return '<article class="paper">\n'
                + renderHeader(titleAttrs, authorList, footnoteList)
                + html
                + renderFootnotes(footnoteList)
                + '</article>\n';
        }

        // Update preview -----------------------------------------------------

        function updatePreview() {
            var startTime = performance.now();
            var content = editor.value;
            if (!content.trim()) return;
            try {
                var html = parse(content);
                preview.innerHTML = html;

                if (typeof renderMathInElement === 'function') {
                    try {
                        renderMathInElement(preview, {
                            delimiters: [
                                { left: '\\[', right: '\\]', display: true },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    } catch (e) {}
                }

                var elapsed = (performance.now() - startTime).toFixed(2);
                parseTime.textContent = 'Parsed in ' + elapsed + 'ms';
            } catch (e) {
                preview.innerHTML = '<div class="error-message">Error: ' + escapeHtml(e.message) + '</div>';
            }
        }

        var debounceTimer;
        editor.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 150);
        });

        refreshBtn.addEventListener('click', updatePreview);

        fetch('./examples/demo.pml')
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then(function(content) {
                editor.value = content;
                updatePreview();
            })
            .catch(function(err) {
                preview.innerHTML = '<div class="error-message">Failed to load demo.pml: ' + escapeHtml(err.message) + '</div>';
            });
    });
    </script>
</body>
</html>
